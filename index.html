<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gehenna AI | ZERG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ----- Импорт шрифта ----- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s;
        }
        .container {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 32px;
            padding: 30px 24px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 40px rgba(220,38,38,0.08);
            text-align: center;
            transition: background 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(220,38,38,0.08);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(0 0 30px rgba(220,38,38,0.25));
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 0 40px rgba(220,38,38,0.3), 0 0 80px rgba(220,38,38,0.1);
            margin-bottom: 4px;
        }
        .brand-sub {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0.8;
            margin-bottom: 16px;
        }
        .divider {
            width: 48px;
            height: 3px;
            background: #dc2626;
            margin: 0 auto 20px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(220,38,38,0.3);
        }
        .greeting {
            font-size: 15px;
            line-height: 1.7;
            color: var(--tg-theme-hint-color);
            margin-bottom: 20px;
        }
        .greeting strong {
            color: #ffffff;
            font-weight: 700;
        }

        /* ----- Новая строка ввода (поле + кнопка стрелка) ----- */
        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .input-row input {
            flex: 1;
            padding: 16px 18px;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            border: 2px solid var(--tg-theme-hint-color);
            border-radius: 16px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        .input-row input:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 4px rgba(220,38,38,0.15), 0 0 30px rgba(220,38,38,0.05);
        }
        .input-row button {
            background: #dc2626;
            border: none;
            border-radius: 16px;
            padding: 16px 20px;
            cursor: pointer;
            font-size: 24px;
            color: #fff;
            transition: transform 0.12s, box-shadow 0.25s, opacity 0.2s;
            box-shadow: 0 4px 24px rgba(220,38,38,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .input-row button:hover {
            opacity: 0.92;
            box-shadow: 0 6px 32px rgba(220,38,38,0.4);
        }
        .input-row button:active {
            transform: scale(0.95);
        }

        /* ----- Кнопка "БОЛЬШЕ ФУНКЦИЙ" (красная, новая) ----- */
        .btn-more {
            width: 100%;
            padding: 14px;
            background: #dc2626;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.25s, opacity 0.2s;
            box-shadow: 0 4px 20px rgba(220,38,38,0.25);
            font-family: 'Inter', sans-serif;
            margin-bottom: 14px;
        }
        .btn-more:hover {
            opacity: 0.92;
            box-shadow: 0 6px 28px rgba(220,38,38,0.35);
        }
        .btn-more:active {
            transform: scale(0.97);
        }

        /* ----- Вторичная кнопка (справка) ----- */
        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--tg-theme-hint-color);
            border: 1px solid var(--tg-theme-hint-color);
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: var(--tg-theme-secondary-bg-color);
            color: var(--tg-theme-text-color);
            border-color: var(--tg-theme-text-color);
        }
        .btn-secondary:active {
            transform: scale(0.97);
        }

        /* ----- Блок результата ----- */
        #result {
            margin-top: 18px;
            padding: 16px 18px;
            border-radius: 16px;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-hint-color);
            font-size: 14px;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--tg-theme-hint-color);
            transition: border-color 0.4s, background 0.3s, color 0.3s;
            line-height: 1.5;
            flex-direction: column;
        }
        #result.success {
            border-color: #22c55e;
            color: #86efac;
        }
        #result.error {
            border-color: #dc2626;
            color: #fca5a5;
        }
        #result.loading {
            border-color: #dc2626;
            color: #fbbf24;
        }
        #result.website {
            border-color: #dc2626;
            color: #dc2626;
            background: rgba(220,38,38,0.06);
            border-style: solid;
        }
        #result .website-link {
            color: #dc2626;
            font-weight: 700;
            text-decoration: underline;
            cursor: default;
        }

        /* ----- Подвал ----- */
        .footer {
            margin-top: 22px;
            font-size: 12px;
            color: var(--tg-theme-hint-color);
            opacity: 0.5;
            letter-spacing: 0.5px;
            border-top: 1px solid var(--tg-theme-hint-color);
            padding-top: 16px;
            opacity: 0.4;
        }
        @media (prefers-color-scheme: dark) {
            .container {
                background: #1a1a24;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Иконка демона -->
        <span class="icon">😈</span>

        <h1>Gehenna AI</h1>
        <div class="brand-sub">⚡ by ZERG ⚡</div>
        <div class="divider"></div>

        <p class="greeting">
            <strong>Gehenna</strong> — ваш персональный ИИ-помощник.<br>
            Анализирую, предсказываю, созидаю.
        </p>

        <!-- Новая кнопка "БОЛЬШЕ ФУНКЦИЙ" -->
        <button class="btn-more" id="moreBtn">🚀 БОЛЬШЕ ФУНКЦИЙ</button>

        <!-- Поле ввода + кнопка стрелка -->
        <div class="input-row">
            <input type="text" id="userInput" placeholder="Введите ваш запрос..." />
            <button id="sendBtn">➡️</button>
        </div>

        <button class="btn-secondary" id="helpBtn">❓ Как работает Gehenna?</button>

        <!-- Блок результата -->
        <div id="result" class="website">
            🌐 Gehenna website: <span class="website-link">xxxxx</span>
        </div>

        <div class="footer">© 2026 ZERG Labs · Защищено шифрованием</div>
    </div>

    <script>
        // ----- Инициализация Telegram WebApp -----
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ----- Получение элементов -----
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const moreBtn = document.getElementById('moreBtn');
        const helpBtn = document.getElementById('helpBtn');
        const result = document.getElementById('result');

        // ----- Функция отправки данных в бота -----
        function sendToBot(data, callback) {
            tg.sendData(data);
            result.className = 'success';
            result.innerHTML = '✅ Запрос получен Gehenna:<br>' + data;
            input.value = '';

            // Через 1.5 секунды показываем ссылку на сайт
            setTimeout(() => {
                result.className = 'website';
                result.innerHTML = '🌐 Gehenna website: <span class="website-link">xxxxx</span>';
                if (callback) callback();
            }, 1500);
        }

        // ----- Обработка основного запроса -----
        function handleSend() {
            const text = input.value.trim();
            if (!text) {
                result.className = 'error';
                result.innerHTML = '⚠️ Пожалуйста, введите текст запроса.';
                return;
            }
            result.className = 'loading';
            result.innerHTML = '⏳ Gehenna обрабатывает запрос...';
            sendToBot('Запрос: ' + text);
        }

        // ----- Кнопка "БОЛЬШЕ ФУНКЦИЙ" -----
        moreBtn.addEventListener('click', function() {
            const msg = 'многофункциональный ИИ помощник для любых ваших запросов тут : xxxxx';
            sendToBot(msg);
        });

        // ----- События для отправки -----
        sendBtn.addEventListener('click', handleSend);
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSend();
            }
        });

        // ----- Кнопка "Как работает" -----
        helpBtn.addEventListener('click', function() {
            tg.showAlert(
                '🛡️ ZERG — ваш цифровой помощник.\n' +
                '🔥 Gehenna — ИИ, обрабатывающий команды.\n' +
                'Напишите запрос и нажмите ➡️ или кнопку "БОЛЬШЕ ФУНКЦИЙ".\n\n' +
                '❗ Сейчас ведутся технические работы, функционал ИИ временно ограничен.'
            );
        });
    </script>
</body>
</html>
