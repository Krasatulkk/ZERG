<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gehenna AI | ZERG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ----- Импорт шрифта ----- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        /* ----- Сброс и глобальные стили ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s;
        }

        /* ----- Основная карточка ----- */
        .container {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 32px;
            padding: 34px 28px 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 40px rgba(239, 68, 68, 0.08);
            text-align: center;
            transition: background 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(239, 68, 68, 0.08);
        }

        /* ----- Иконка (большая эмодзи тигра) ----- */
        .icon {
            font-size: 64px;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(0 0 30px rgba(239, 68, 68, 0.25));
        }

        /* ----- Заголовок Gehenna AI с градиентом и свечением ----- */
        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f97316, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(239, 68, 68, 0.25), 0 0 80px rgba(239, 68, 68, 0.08);
            margin-bottom: 4px;
        }

        /* ----- Подзаголовок ZERG ----- */
        .brand-sub {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--tg-theme-hint-color);
            margin-bottom: 16px;
            opacity: 0.7;
        }

        /* ----- Разделитель ----- */
        .divider {
            width: 48px;
            height: 3px;
            background: linear-gradient(90deg, #f97316, #ef4444);
            margin: 0 auto 20px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        /* ----- Текст приветствия ----- */
        .greeting {
            font-size: 15px;
            line-height: 1.7;
            color: var(--tg-theme-hint-color);
            margin-bottom: 24px;
        }
        .greeting strong {
            color: #f97316;
            font-weight: 700;
        }

        /* ----- Поле ввода ----- */
        .input-field {
            width: 100%;
            padding: 16px 18px;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            border: 2px solid var(--tg-theme-hint-color);
            border-radius: 16px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            margin-bottom: 14px;
        }
        .input-field:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15), 0 0 30px rgba(239, 68, 68, 0.05);
        }

        /* ----- Кнопка с градиентом и эффектом нажатия ----- */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f97316, #ef4444);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.25s, opacity 0.2s;
            box-shadow: 0 4px 24px rgba(239, 68, 68, 0.3);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }
        .btn-primary:hover {
            opacity: 0.92;
            box-shadow: 0 6px 32px rgba(239, 68, 68, 0.4);
        }
        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 2px 12px rgba(239, 68, 68, 0.3);
        }

        /* ----- Кнопка "Назад" (вторичная) ----- */
        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--tg-theme-hint-color);
            border: 1px solid var(--tg-theme-hint-color);
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: var(--tg-theme-secondary-bg-color);
            color: var(--tg-theme-text-color);
            border-color: var(--tg-theme-text-color);
        }
        .btn-secondary:active {
            transform: scale(0.97);
        }

        /* ----- Блок результата (меняет цвет рамки) ----- */
        #result {
            margin-top: 18px;
            padding: 16px 18px;
            border-radius: 16px;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-hint-color);
            font-size: 14px;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--tg-theme-hint-color);
            transition: border-color 0.4s, background 0.3s, color 0.3s;
            line-height: 1.5;
        }
        #result.success {
            border-color: #22c55e;
            color: #86efac;
        }
        #result.error {
            border-color: #ef4444;
            color: #fca5a5;
        }
        #result.loading {
            border-color: #f97316;
            color: #fbbf24;
        }
        #result.maintenance {
            border-color: #f97316;
            color: #f97316;
            background: rgba(239, 68, 68, 0.06);
            border-style: solid;
        }

        /* ----- Подвал с копирайтом ----- */
        .footer {
            margin-top: 22px;
            font-size: 12px;
            color: var(--tg-theme-hint-color);
            opacity: 0.5;
            letter-spacing: 0.5px;
            border-top: 1px solid var(--tg-theme-hint-color);
            padding-top: 16px;
            opacity: 0.4;
        }

        /* ----- Адаптация под тему Telegram (переменные уже используются) ----- */
        @media (prefers-color-scheme: dark) {
            .container {
                background: #1a1a24;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Иконка тигра 🐯 -->
        <span class="icon">🐯</span>

        <!-- Заголовок Gehenna AI -->
        <h1>Gehenna AI</h1>
        <div class="brand-sub">⚡ by ZERG ⚡</div>
        <div class="divider"></div>

        <!-- Текст приветствия -->
        <p class="greeting">
            <strong>Gehenna</strong> — ваш персональный ИИ-помощник.<br>
            Анализирую, предсказываю, созидаю.
        </p>

        <!-- Поле ввода -->
        <input class="input-field" type="text" id="userInput" placeholder="Введите ваш запрос..." />

        <!-- Кнопка отправки (градиент) -->
        <button class="btn-primary" id="sendBtn">🔥 Спросить Gehenna</button>

        <!-- Дополнительная кнопка (заглушка) -->
        <button class="btn-secondary" id="helpBtn">❓ Как работает Gehenna?</button>

        <!-- Блок результата -->
        <div id="result" class="maintenance">
            🔧 СЕЙЧАС ПРОВОДЯТСЯ ТЕХНИЧЕСКИЕ РАБОТЫ,<br>приносим свои извинения
        </div>

        <!-- Подвал -->
        <div class="footer">© 2026 ZERG Labs · Защищено шифрованием</div>
    </div>

    <script>
        // ----- Инициализация Telegram WebApp -----
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ----- Получение элементов -----
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const helpBtn = document.getElementById('helpBtn');
        const result = document.getElementById('result');

        // ----- Функция отправки данных в бота -----
        function sendToBot(data) {
            tg.sendData(data);
            result.className = 'success';
            result.innerHTML = '✅ Запрос получен Gehenna:<br>' + data;
            input.value = '';
        }

        // ----- Отправка с проверкой ввода -----
        function handleSend() {
            const text = input.value.trim();
            if (!text) {
                result.className = 'error';
                result.innerHTML = '⚠️ Пожалуйста, введите текст запроса.';
                return;
            }
            result.className = 'loading';
            result.innerHTML = '⏳ Gehenna обрабатывает запрос...';

            setTimeout(() => {
                sendToBot('Запрос: ' + text);
                setTimeout(() => {
                    result.className = 'maintenance';
                    result.innerHTML = '🔧 СЕЙЧАС ПРОВОДЯТСЯ ТЕХНИЧЕСКИЕ РАБОТЫ,<br>приносим свои извинения';
                }, 1500);
            }, 1200);
        }

        // ----- События -----
        sendBtn.addEventListener('click', handleSend);
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSend();
            }
        });

        // ----- Кнопка "Как работает" -----
        helpBtn.addEventListener('click', function() {
            tg.showAlert(
                '🛡️ ZERG — ваш цифровой помощник.\n' +
                '🔥 Gehenna — ИИ, обрабатывающий команды.\n' +
                'Напишите запрос и нажмите "Спросить Gehenna".\n\n' +
                '❗ Сейчас ведутся технические работы, функционал ИИ временно ограничен.'
            );
        });
    </script>
</body>
</html>
