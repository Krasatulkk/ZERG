<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мини-приложение</title>
<style>
    /* Сброс стилей */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Arial', 'Helvetica', sans-serif;
        background-color: #333;
    }

    /* Основной контейнер (серый фон + узор) */
    .mini-app {
        width: 100%;
        max-width: 400px; /* формат мини-приложения */
        background-color: #7a7a7a; /* серый фон */
        
        /* Адский узор на сером фоне */
        background-image: 
            repeating-linear-gradient(45deg, rgba(0,0,0,0.15) 0, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 8px),
            repeating-linear-gradient(-45deg, rgba(0,0,0,0.15) 0, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 8px);
        
        border-radius: 24px;
        padding: 25px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        display: flex;
        flex-direction: column;
    }

    /* 1. Текст с извинениями (ярко-белый) */
    .apology {
        color: #ffffff;
        font-size: 16px;
        line-height: 1.5;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.7); /* Эффект свечения */
        margin-bottom: 15px;
        font-weight: bold;
    }

    /* 2. Картинка (под текстом) */
    .hero-image {
        width: 100%;
        height: auto;
        aspect-ratio: 4/3;
        object-fit: cover;
        border-radius: 16px;
        margin-bottom: 20px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    /* 3. Текст про Геену */
    .geena {
        display: flex;
        flex-wrap: wrap;
        margin-bottom: 15px;
    }
    .geena-label {
        color: #8B0000; /* <--- ИЗМЕНЕНО: ТЕПЕРЬ СЛОВО "ГЕЕНА" КРОВАВО-КРАСНОЕ */
        font-weight: bold;
        margin-right: 4px;
    }
    .geena-desc {
        color: #ffffff; /* после черточки - ярко белый */
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
    }

    /* 4. Раздел "Как работает Геена" */
    .header-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 5px;
    }
    .blood-red {
        color: #8B0000; /* Кроваво-красный */
        font-weight: 900;
        font-size: 18px;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(139, 0, 0, 0.6);
    }
    .info-icon {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 22px;
        height: 22px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        color: #ffffff;
        font-size: 14px;
        font-weight: bold;
        border: 1px solid rgba(255, 255, 255, 0.4);
        cursor: pointer;
    }
</style>
</head>
<body>

<div class="mini-app">
    
    <!-- Текст с извинениями -->
    <p class="apology">Приносим извинения за технические неполадки и временные неудобства в работе сервиса.</p>

    <!-- ВСТАВЬТЕ СЮДА ВАШУ КАРТИНКУ (см. инструкцию ниже) -->
    <img class="hero-image" src="lion.jpg" alt="Lion illustration">

    <!-- Геена -->
    <p class="geena">
        <span class="geena-label">Геена -</span>
        <span class="geena-desc">безжалостное и мрачное пространство, где сгорают цифровые ошибки.</span>
    </p>

    <!-- Заголовок + иконка информации -->
    <div class="header-row">
        <span class="blood-red">Как работает Геена</span>
        <span class="info-icon">i</span>
    </div>

</div>

</body>
</html>
