<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .emoji {
            font-size: 100px;
            margin-bottom: 20px;
            filter: grayscale(100%);
            opacity: 0.8;
        }
        .zerg {
            font-size: 90px;
            font-weight: 900;
            letter-spacing: 10px;
            color: #ffffff;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .btn {
            background-color: #dc2626;
            color: #ffffff;
            border: none;
            padding: 20px 50px;
            font-size: 22px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4);
        }
        .btn:hover {
            background-color: #b91c1c;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">👤</div>
        <div class="zerg">ZERG</div>
        <button class="btn" id="infoBtn">givemeallinfo</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        document.getElementById('infoBtn').addEventListener('click', function() {
            tg.sendData('Наш ТГ-канал @ffzerg, вся информация там.');
        });
    </script>
</body>
</html>
